<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0c10">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Olympus Link</title>
<meta name="description" content="Link your World of Warcraft character to your Discord account and get your Olympus role.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<a class="skip" id="skip" href="#app">Skip to the steps</a>
<p class="demo-banner" id="demo-banner" hidden></p>
<div class="shell">
	<header class="hero">
		<div class="who" id="who"></div>
		<img class="hero-emblem" src="assets/emblem.png" alt="" width="76" height="76">
		<h1 class="hero-title">Olympus Link</h1>
		<p class="hero-tagline" id="tagline">Link your World of Warcraft character to your Discord account.</p>
	</header>

	<main id="app" class="app" tabindex="-1">
		<noscript><p class="card">Olympus Link needs JavaScript.</p></noscript>
	</main>

	<footer class="foot">
		<p class="foot-privacy"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span id="privacy-line">Your screen and files stay on your computer. Only the signed link is sent.</span></p>
		<p class="foot-small" id="footer-line">Olympus Link is part of the Olympus addon, a fan project not affiliated with Blizzard Entertainment.</p>
	</footer>
</div>
</body>
</html>
