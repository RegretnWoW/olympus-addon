name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LuaJIT and Python's cryptography
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends luajit python3-cryptography

      - name: Verify check script failure handling
        run: bash tests/check-scripts.sh

      - name: Run repository checks
        run: bash scripts/check.sh

      # Olympus Link's page, core, reference Worker and tools (web/test). The D1 tests skip
      # themselves without node:sqlite (Node 22.13 or newer): here that stops the job instead.
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check node:sqlite
        run: node -e "require('node:sqlite')"

      - name: Run the Olympus Link web tests
        run: node --test web/test/*.test.mjs
