name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends luajit

      - name: Verify check script failure handling
        run: bash tests/check-scripts.sh

      - name: Run repository checks
        run: bash scripts/check.sh
